<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2026 전교인 성경퀴즈대회</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#37352f;
    --text-muted:#9b9a97;
    --border:#e9e9e7;
    --hover:#f5f5f4;
    --sidebar:#fbfbfa;
    --shadow:0 1px 3px rgba(15,15,15,.08), 0 3px 12px rgba(15,15,15,.06);
    --radius:8px;
    --t10:#2383e2; --t10bg:#eaf3fc;
    --t20:#0f9d58; --t20bg:#e8f5ee;
    --t30:#d9730d; --t30bg:#faecdf;
    --t40:#9333ea; --t40bg:#f3e8fd;
    --t50:#e03e3e; --t50bg:#fce8e8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:var(--bg);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}

  /* ---------- top bar ---------- */
  .topbar{
    height:46px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;
    position:sticky;top:0;background:var(--bg);z-index:50;
  }
  .topbar .left{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .topbar .right{font-size:13px;color:var(--text-muted)}

  /* ---------- shell ---------- */
  .shell{display:flex;height:calc(100vh - 46px);overflow:hidden}
  .sidebar{
    width:52px;flex-shrink:0;background:var(--sidebar);
    border-right:1px solid var(--border);padding:10px 6px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .sidebar .nav-item{
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:8px;color:var(--text);
    text-decoration:none;font-size:19px;
  }
  .sidebar .nav-item:hover{background:var(--hover)}
  .sidebar .nav-item.active{background:#eceae7}
  .content{flex:1;min-width:0;height:100%;overflow:hidden;display:flex;flex-direction:column;padding:18px 28px;max-width:1500px;margin:0 auto;width:100%}
  .content.scrollable{overflow-y:auto;padding:26px 34px 40px;display:block}

  h1.page-title{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;flex-shrink:0}
  .page-sub{color:var(--text-muted);margin:0 0 12px;font-size:13px;flex-shrink:0}

  /* ---------- grid ---------- */
  .grid-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:1;min-height:0}
  .tier-col{min-width:0;min-height:0;display:grid;grid-template-rows:24px repeat(6,1fr);gap:8px}
  .tier-head{
    font-weight:700;font-size:12px;border-radius:6px;text-align:center;
    display:flex;align-items:center;justify-content:center;
  }
  .t-10 .tier-head{background:var(--t10bg);color:var(--t10)}
  .t-20 .tier-head{background:var(--t20bg);color:var(--t20)}
  .t-30 .tier-head{background:var(--t30bg);color:var(--t30)}
  .t-40 .tier-head{background:var(--t40bg);color:var(--t40)}
  .t-50 .tier-head{background:var(--t50bg);color:var(--t50)}

  .qtile{
    border:1px solid rgba(0,0,0,.06);border-radius:var(--radius);
    padding:6px 8px;overflow:hidden;min-height:0;gap:3px;
    transition:box-shadow .12s, filter .12s, transform .05s;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    text-decoration:none;color:#fff;
  }
  .t-10 .qtile{background:var(--t10)}
  .t-20 .qtile{background:var(--t20)}
  .t-30 .qtile{background:var(--t30)}
  .t-40 .qtile{background:var(--t40)}
  .t-50 .qtile{background:var(--t50)}
  .qtile:hover{box-shadow:var(--shadow);filter:brightness(1.07)}
  .qtile:active{transform:translateY(1px)}
  .qtile .qnum{font-size:clamp(26px,6vh,46px);font-weight:800;line-height:1;letter-spacing:-.01em;flex-shrink:0}
  .qtile.solved{background:#fff;color:var(--text);border-color:var(--border);filter:none}
  .qtile.solved:hover{filter:none;box-shadow:var(--shadow)}
  .qtile .solvedtag{
    font-size:clamp(15px,2.6vh,22px);font-weight:800;line-height:1.25;flex-shrink:0;color:var(--text);
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }

  /* ---------- mini scoreboard ---------- */
  .mini-wrap{flex-shrink:0;margin-top:12px}
  .mini-scoreboard{
    border:1px solid var(--border);border-radius:10px;padding:8px 12px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;
    background:var(--sidebar);transition:box-shadow .12s,border-color .12s;
  }
  .mini-scoreboard:hover{box-shadow:var(--shadow);border-color:#d3d2ce}
  .mini-scoreboard .mlabel{font-size:12px;color:var(--text-muted);font-weight:600;margin-right:4px}
  .mchip{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--border)}
  .mchip .msc{font-weight:800}
  .mchip.lead{border-color:#f2c94c;box-shadow:0 0 0 2px #f9e9b8 inset}
  .mini-hint{margin-left:auto;font-size:12px;color:var(--text-muted)}

  /* ---------- question page ---------- */
  .qpage{flex:1;min-height:0;display:flex;flex-direction:column}
  .q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-shrink:0}
  .q-back{font-size:15px;font-weight:700;color:#fff;background:var(--text);text-decoration:none;padding:8px 16px;border-radius:8px;box-shadow:var(--shadow)}
  .q-back:hover{opacity:.85}
  .q-nav{display:flex;gap:6px}
  .q-nav a,.q-nav span{
    font-size:13px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--text)
  }
  .q-nav a:hover{background:var(--hover)}
  .q-nav .disabled{opacity:.4;pointer-events:none}


  .q-meta{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;flex-shrink:0}
  .q-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .q-badge.tier{color:#fff}
  .q-badge.type{background:var(--hover);color:var(--text)}

  .q-main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:10px 0}
  .q-text{
    font-size:clamp(24px,3.6vw,44px);font-weight:700;line-height:1.5;white-space:pre-wrap;
    text-align:left;max-width:1050px
  }
  .q-text.long{font-size:clamp(19px,2.3vw,28px);line-height:1.55}
  .q-choices{display:block;text-align:left;margin-top:.6em}
  .q-explain{flex-shrink:0;max-height:24vh;overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .coop-box{
    border-left:3px solid var(--t40);background:var(--t40bg);border-radius:0 8px 8px 0;
    padding:10px 14px;font-size:13.5px;white-space:pre-wrap
  }
  .coop-box b{color:var(--t40)}
  .q-images{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
  .q-images img{max-height:34vh;max-width:100%;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);object-fit:contain;background:#fff}

  /* ---------- 연결형 문항 (드래그 매칭) ---------- */
  .connect-box{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
  .connect-intro{
    font-size:clamp(19px,2.6vw,30px);font-weight:700;line-height:1.5;text-align:center;
    white-space:pre-wrap;max-width:900px
  }
  .connect-wrap{position:relative;display:flex;justify-content:space-between;gap:min(18vw,220px);width:100%;max-width:820px}
  .connect-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .connect-col{display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
  .connect-item{
    display:flex;align-items:center;gap:10px;border:2px solid var(--border);border-radius:10px;
    padding:10px 14px;background:var(--bg);font-size:clamp(15px,1.8vw,20px);font-weight:600;
    cursor:grab;user-select:none;touch-action:none;position:relative;z-index:1;
    transition:border-color .15s,box-shadow .15s
  }
  .connect-item.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--hover) inset}
  .connect-item.dragging{cursor:grabbing;border-color:var(--text)}
  .connect-item .connect-label{font-weight:800;flex-shrink:0;color:var(--text-muted)}
  .connect-item .connect-text{flex:1;min-width:0}
  .connect-dot{
    width:16px;height:16px;border-radius:50%;border:3px solid var(--text-muted);background:var(--bg);
    flex-shrink:0;transition:background .15s,border-color .15s,transform .15s
  }
  .connect-item.dragging .connect-dot{transform:scale(1.25)}
  .connect-reset{
    font-size:12px;color:var(--text-muted);background:transparent;border:1px dashed var(--border);
    border-radius:6px;padding:5px 12px
  }
  .connect-reset:hover{background:var(--hover);color:var(--text)}

  .answer-row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px;
    padding-top:12px;border-top:1px solid var(--border);flex-shrink:0
  }
  .reveal-btn{
    font-size:12px;color:var(--text-muted);background:transparent;border:1px dashed var(--border);
    border-radius:6px;padding:6px 12px
  }
  .reveal-btn:hover{background:var(--hover);color:var(--text)}
  .award-btn{
    font-size:15px;font-weight:700;color:#fff;background:var(--t20);border:none;border-radius:8px;
    padding:10px 20px;box-shadow:var(--shadow)
  }
  .award-btn:hover{filter:brightness(.96)}
  .award-btn.undo{background:var(--bg);color:var(--t50);border:1px solid var(--t50);box-shadow:none}

  .modal.answer-modal{width:min(640px,92vw);text-align:center}
  .answer-modal .alabel{font-size:12px;font-weight:800;color:var(--t20);letter-spacing:.08em}
  .answer-modal .atext{font-size:clamp(24px,3vw,34px);font-weight:800;margin:8px 0 16px;white-space:pre-wrap;line-height:1.45}
  .answer-modal .refs{font-size:14px;color:#555;line-height:1.7;text-align:left;background:var(--hover);border-radius:8px;padding:10px 14px}
  .answer-modal .refs div{padding:2px 0}
  .answer-modal .note{margin-top:10px;font-size:12.5px;color:var(--text-muted);white-space:pre-wrap;text-align:left}
  .answer-modal .modal-actions{justify-content:center;margin-top:16px}

  .solved-banner{
    margin-top:8px;font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:8px;color:#fff;
    display:flex;align-items:center;gap:8px;flex-shrink:0
  }

  /* ---------- scoreboard page ---------- */
  .sb-list{display:flex;flex-direction:column;gap:14px;margin-top:10px}
  .sb-row{display:flex;align-items:center;gap:18px}
  .sb-rank{font-size:22px;font-weight:800;width:44px;text-align:center;color:var(--text-muted)}
  .sb-rank.r1{color:#e0a80d}.sb-rank.r2{color:#9b9a97}.sb-rank.r3{color:#c07f43}
  .sb-main{flex:1;min-width:0}
  .sb-name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .sb-bar-track{height:20px;background:var(--hover);border-radius:20px;margin-top:6px;overflow:hidden}
  .sb-bar{height:100%;border-radius:20px;transition:width .5s ease}
  .sb-score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px;text-align:right}

  /* ---------- settings ---------- */
  .set-block{border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px;max-width:640px}
  .set-block h3{margin:0 0 4px;font-size:16px}
  .set-block p.hint{margin:0 0 16px;font-size:13px;color:var(--text-muted)}
  .count-btns{display:flex;gap:6px;margin-bottom:18px}
  .count-btns button{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:6px 14px;font-weight:700}
  .count-btns button.on{background:var(--text);color:#fff;border-color:var(--text)}
  .team-input-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .team-input-row .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .team-input-row input{
    flex:1;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:14px;font-family:inherit
  }
  .team-input-row input:focus{outline:2px solid var(--t10);outline-offset:-1px}
  .team-input-row.off{opacity:.35}
  .btn{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:8px 16px;font-weight:600;font-size:14px}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
  .btn.danger{color:var(--t50);border-color:#f0c9c9}
  .btn.danger:hover{background:var(--t50bg)}

  /* ---------- modal ---------- */
  .modal-back{
    position:fixed;inset:0;background:rgba(15,15,15,.4);display:flex;align-items:center;justify-content:center;z-index:100
  }
  .modal{
    background:var(--bg);border-radius:14px;padding:24px;width:min(440px,92vw);box-shadow:var(--shadow)
  }
  .modal h3{margin:0 0 4px;font-size:18px}
  .modal p{margin:0 0 18px;font-size:13.5px;color:var(--text-muted)}
  .score-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .score-pick button{
    border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:6px 13px;font-weight:700;font-size:13px
  }
  .score-pick button:hover{background:var(--hover)}
  .score-pick button.on{background:var(--text);color:#fff;border-color:var(--text)}
  .team-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .team-pick button{
    border:1px solid var(--border);border-radius:8px;padding:12px;font-size:15px;font-weight:700;background:var(--bg);
    display:flex;align-items:center;gap:8px;justify-content:center
  }
  .team-pick button:hover{background:var(--hover)}
  .team-pick button .dot{width:12px;height:12px;border-radius:50%}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;
    z-index:200;box-shadow:var(--shadow);animation:toastin .2s ease
  }
  @keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}

  .kbd-hint{font-size:11px;color:var(--text-muted);flex-shrink:0;margin-top:6px;text-align:center}
  .kbd-hint kbd{
    border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-family:inherit;font-size:10px;background:var(--sidebar)
  }

  @media(max-width:900px){
    .content{padding:14px 14px}
    .grid-cols{grid-template-columns:repeat(3,1fr)}
    .tier-col{grid-template-rows:22px repeat(6,minmax(56px,1fr))}
  }

  @media(max-width:640px){
    html,body{height:auto;overflow:auto}
    .topbar{padding:0 12px}
    .topbar .left{font-size:14px}
    .topbar .right{font-size:11px}
    .shell{display:block;height:auto;overflow:visible;padding-bottom:calc(58px + env(safe-area-inset-bottom))}
    .sidebar{
      position:fixed;left:0;right:0;bottom:0;width:auto;z-index:60;
      flex-direction:row;justify-content:space-around;
      border-right:none;border-top:1px solid var(--border);
      padding:6px 8px calc(6px + env(safe-area-inset-bottom))
    }
    .sidebar .nav-item{width:48px;height:44px;font-size:21px}
    .content,.content.scrollable{height:auto;overflow:visible;display:block;padding:12px 10px 20px}
    .grid-cols{grid-template-columns:repeat(5,1fr);gap:5px}
    .tier-col{grid-template-rows:22px repeat(6,58px);gap:5px}
    .tier-head{font-size:11px}
    .qtile{padding:4px 2px;border-radius:6px}
    .qtile .qnum{font-size:24px}
    .qtile .solvedtag{font-size:11px;white-space:normal;line-height:1.2;word-break:keep-all}
    .mini-hint{display:none}
    .mchip{font-size:12px;padding:2px 8px}
    .qpage{display:block}
    .q-main{overflow:visible;padding:18px 0}
    .q-text{font-size:21px}
    .q-text.long{font-size:17px}
    .connect-intro{font-size:17px}
    .connect-wrap{gap:8vw}
    .connect-item{font-size:14px;padding:8px 10px;gap:6px}
    .connect-dot{width:13px;height:13px}
    .q-explain{max-height:none}
    .q-images img{max-height:none;width:100%}
    .answer-row{flex-direction:column-reverse;align-items:stretch;gap:8px}
    .award-btn{width:100%;padding:13px}
    .reveal-btn{padding:10px}
    .kbd-hint{display:none}
    .sb-row{gap:10px}
    .sb-rank{font-size:18px;width:30px}
    .sb-name{font-size:15px}
    .sb-score{font-size:22px;min-width:50px}
    .set-block{padding:16px 14px}
    .count-btns{flex-wrap:wrap}
    .modal{padding:18px}
    .answer-modal .atext{font-size:22px}
    .answer-modal .refs{max-height:40vh;overflow:auto}
    .toast{bottom:calc(76px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="left">2026 전교인 성경퀴즈대회</div>
  <div class="right">꿈꾸는교회 청년부</div>
</div>
<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="app"></main>
</div>
<div id="overlay"></div>
<div id="toast"></div>

<script>
/* ============================================================
   문항 데이터 — 성경퀴즈대회 2026 배점별 최종 문항(10~50점, 각 6문항)
   출처: "성경퀴즈대회 문항 최종_정리.md" 문제은행에서 선정
   (quiz_questions_10to50.js 의 SELECTED_QUESTIONS 를 그대로 반영함)

   ※ 검수 필요 문항:
     · 50-4: 문제 형식 추후 확정 필요
     · 50-5: ㄷ·ㄹ 항목(구절·정답) 미기재 — 추후 보완 필요
     · 50-6: 정답이 원본에 기재되어 있지 않음 — 확정 필요
   ============================================================ */
const QUESTIONS = [

  /* ---------------- 10점 (6/6 확보) ---------------- */
  { id:"10-1", tier:10, type:`OX퀴즈`,
    q:`28장 1절의 "악인은 쫓아오는 자가 없어도 도망하나 의인은 사자 같이 담대하리라"는 악인의 소심함을 꾸짖고, 의인의 용맹함을 칭찬하고 있다. (O / X)`,
    a:`X`,
    refs:[`잠언 28:1 "악인은 쫓아오는 자가 없어도 도망하나 의인은 사자 같이 담대하리라"`,
          `해설: 악인이 소심하고 의인이 용기롭다는 뜻이 아니라, 의인은 하나님 앞에 살기 때문에 담대하다는 의미`],
    src:`예성 탭 4번` },

  { id:"10-2", tier:10, type:`4지선다`,
    q:`다음 중 잠언 3장에서 지혜를 얻은 사람이 누리는 복으로 언급되지 않은 것은?\n\n① 장수\n② 명예\n③ 평강\n④ 부귀`,
    a:`② 명예`,
    refs:[`잠언 3장`],
    src:`민주 탭 26번` },
    // ↑ 교체됨(2026-09-13): 기존 10-2 "지식의 근본"(민주 탭 25번, 정답: 여호와를 경외하는 것)에서 변경

  { id:"10-3", tier:10, type:`5지선다`,
    q:`잠언 10장의 저자는 누구일까요?\n\n① 아굴\n② 솔로몬\n③ 지혜자들\n④ 르무엘 왕\n⑤ 히스기야의 신하들`,
    a:`② 솔로몬`,

const QMAP = {};
QUESTIONS.forEach(q => QMAP[q.id] = q);
const TIERS = [10,20,30,40,50];
const TEAM_COLORS = ["#eb5757","#f2994a","#e0a80d","#27ae60","#2f80ed","#9b51e0"];

/* ============================================================
   상태 (localStorage)
   ============================================================ */
const LS_KEY = "bq2026";
const DEFAULT_STATE = {
  names: ["1조","2조","3조","4조","5조","6조"],
  teamCount: 6,
  solved: {}   // { "10-1": {team: 0} }
};
let state = loadState();

function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_KEY));
    if(!raw) return structuredClone(DEFAULT_STATE);
    return {
      names: Array.isArray(raw.names) && raw.names.length===6 ? raw.names : structuredClone(DEFAULT_STATE.names),
      teamCount: [2,3,4,5,6].includes(raw.teamCount) ? raw.teamCount : 6,
      solved: raw.solved && typeof raw.solved==="object" ? raw.solved : {}
    };
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function teamScores(){
  const s = new Array(state.teamCount).fill(0);
  for(const [qid,rec] of Object.entries(state.solved)){
    const q = QMAP[qid];
    if(q && rec && rec.team < state.teamCount) s[rec.team] += (rec.score ?? q.tier);
  }
  return s;
}

/* ============================================================
   라우팅
   ============================================================ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if(parts[0] === "q" && parts[1]) return { name:"question", id:decodeURIComponent(parts[1]) };
  if(parts[0] === "scoreboard") return { name:"scoreboard" };
  if(parts[0] === "settings") return { name:"settings" };
  return { name:"grid" };
}
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function render(){
  document.onkeydown = null;
  closeModal();
  const route = parseHash();
  renderSidebar(route);
  const app = document.getElementById("app");
  app.className = "content" + ((route.name === "scoreboard" || route.name === "settings") ? " scrollable" : "");
  if(route.name === "question"){
    if(!QMAP[route.id]){ location.hash = "#/"; return; }
    app.innerHTML = viewQuestion(QMAP[route.id]);
    initQuestion(QMAP[route.id]);
  } else if(route.name === "scoreboard"){
    app.innerHTML = viewScoreboard();
  } else if(route.name === "settings"){
    app.innerHTML = viewSettings();
    initSettings();
  } else {
    app.innerHTML = viewGrid();
    initGrid();
  }
  window.scrollTo(0,0);
}

function renderSidebar(route){
  const items = [
    { hash:"#/", icon:"📖", label:"문항 그리드", on: route.name==="grid"||route.name==="question" },
    { hash:"#/scoreboard", icon:"🏆", label:"점수판", on: route.name==="scoreboard" },
    { hash:"#/settings", icon:"⚙️", label:"설정 · 조 편성", on: route.name==="settings" },
  ];
  document.getElementById("sidebar").innerHTML =
    items.map(i => `<a class="nav-item ${i.on?"active":""}" href="${i.hash}" title="${i.label}">${i.icon}</a>`).join("");
}

/* ============================================================
   그리드 화면
   ============================================================ */
function viewGrid(){
  const scores = teamScores();
  const cols = TIERS.map((tier, ti) => {
    const qs = QUESTIONS.filter(q => q.tier === tier);
    const tiles = qs.map((q, r) => {
      const num = r * 5 + ti + 1;
      const rec = state.solved[q.id];
      if(rec && rec.team < state.teamCount){
        return `<a class="qtile solved" href="#/q/${q.id}">
          <span class="solvedtag">✓ ${esc(state.names[rec.team])} +${rec.score ?? q.tier}</span>
        </a>`;
      }
      return `<a class="qtile" href="#/q/${q.id}">
        <div class="qnum">${num}</div>
      </a>`;
    }).join("");
    return `<div class="tier-col t-${tier}">
      <div class="tier-head">${tier}점</div>
      ${tiles}
    </div>`;
  }).join("");

  const lead = Math.max(...scores);
  const chips = state.names.slice(0, state.teamCount).map((n,i) =>
    `<span class="mchip ${scores[i]===lead && lead>0 ? "lead":""}">
      <span class="dot" style="width:8px;height:8px;border-radius:50%;background:${TEAM_COLORS[i]}"></span>
      ${esc(n)} <span class="msc">${scores[i]}</span>
    </span>`).join("");

  return `
    <div class="grid-cols">${cols}</div>
    <div class="mini-wrap">
      <div class="mini-scoreboard" id="miniSb">
        <span class="mlabel">조별 점수</span>
        ${chips}
        <span class="mini-hint">클릭하면 점수판 크게 보기 →</span>
      </div>
    </div>
  `;
}
function initGrid(){
  const m = document.getElementById("miniSb");
  if(m) m.addEventListener("click", () => location.hash = "#/scoreboard");
}

/* ============================================================
   문항 화면
   ============================================================ */
function viewQuestion(q){
  const idx = QUESTIONS.findIndex(x => x.id === q.id);
  const prev = idx > 0 ? QUESTIONS[idx-1] : null;
  const next = idx < QUESTIONS.length-1 ? QUESTIONS[idx+1] : null;
  const rec = state.solved[q.id];
  const tierColor = `var(--t${q.tier})`;

  const coop = q.coop ? `<div class="coop-box"><b>협동 방식</b>\n${esc(q.coop)}</div>` : "";
  const imagesHtml = (q.img && q.img.length)
    ? `<div class="q-images">${q.img.map((src, i) => `<img src="${encodeURI(src)}" alt="${esc(q.id)} 그림 ${i+1}">`).join("")}</div>`
    : "";

  const connectParsed = (q.type && q.type.includes("연결형")) ? parseConnectQ(q.q) : null;
  const isConnect = !!(connectParsed && connectParsed.left && connectParsed.right);

  let solvedBanner = "";
  if(rec && rec.team < state.teamCount){
    solvedBanner = `<div class="solved-banner" style="background:${TEAM_COLORS[rec.team]}">
      ✓ ${esc(state.names[rec.team])} 정답 처리됨 (+${rec.score ?? q.tier}점)
    </div>`;
  }

  const awardBtn = (rec && rec.team < state.teamCount)
    ? `<button class="award-btn undo" id="awardBtn">정답 처리 취소 / 변경</button>`
    : `<button class="award-btn" id="awardBtn" style="background:${tierColor}">정답 처리 · 점수 부여</button>`;

  return `
    <div class="qpage">
      <div class="q-top">
        <a class="q-back" href="#/">← 그리드로</a>
        <div class="q-nav">
          ${prev ? `<a href="#/q/${prev.id}">← ${prev.id}</a>` : `<span class="disabled">← 이전</span>`}
          ${next ? `<a href="#/q/${next.id}">${next.id} →</a>` : `<span class="disabled">다음 →</span>`}
        </div>
      </div>

      <div class="q-meta">
        <span class="q-badge tier" style="background:${tierColor}">${q.tier}점</span>
        <span class="q-badge type">${esc(q.type)}</span>
        <span class="q-badge type" style="background:transparent;color:var(--text-muted)">문항 ${q.id}</span>
      </div>

      <div class="q-main">
        ${isConnect ? renderConnectUI(connectParsed) : `<div class="q-text${q.q.length > 110 ? " long" : ""}">${renderQBlock(q.q)}</div>`}
        ${imagesHtml}
      </div>

      ${coop ? `<div class="q-explain">${coop}</div>` : ""}
      ${solvedBanner}
      <div class="answer-row">
        <button class="reveal-btn" id="revealBtn">🔒 정답 보기</button>
        ${awardBtn}
      </div>
      <div class="kbd-hint">
        <kbd>A</kbd> 정답 · <kbd>←</kbd> <kbd>→</kbd> 문항 이동
      </div>
    </div>
  `;
}

function initQuestion(q){
  window.onresize = null;
  if(q.type && q.type.includes("연결형")){
    const parsed = parseConnectQ(q.q);
    if(parsed.left && parsed.right) initConnectUI(parsed);
  }

  /* ---- 정답 공개 (중앙 팝업, DOM에 미리 넣지 않음) ---- */
  const revealBtn = document.getElementById("revealBtn");
  revealBtn.addEventListener("click", () => {
    if(document.querySelector(".answer-modal")) closeModal();
    else openAnswerModal(q);
  });

  /* ---- 점수 부여 ---- */
  document.getElementById("awardBtn").addEventListener("click", () => openAwardModal(q));

  /* ---- 단축키 ---- */
  document.onkeydown = (e) => {
    if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if(e.key === "a" || e.key === "A"){ revealBtn.click(); }
    else if(e.key === "Escape"){ closeModal(); }
    else if(e.key === "ArrowLeft"){ const i = QUESTIONS.findIndex(x=>x.id===q.id); if(i>0) location.hash = "#/q/"+QUESTIONS[i-1].id; }
    else if(e.key === "ArrowRight"){ const i = QUESTIONS.findIndex(x=>x.id===q.id); if(i<QUESTIONS.length-1) location.hash = "#/q/"+QUESTIONS[i+1].id; }
  };
}

/* ============================================================
   연결형 문항 — 드래그/터치로 선 잇기
   ============================================================ */
const CONNECT_COLORS = ["#2383e2","#0f9d58","#d9730d","#9333ea","#e03e3e","#0d9488","#c2185b"];

// q.q 텍스트에서 마지막 블록이 ①②③④... 선지 목록이면 좌측정렬 블록으로 분리
function renderQBlock(text){
  const blocks = String(text).split(/\n\n+/);
  const last = blocks[blocks.length-1];
  const lines = last.split("\n").filter(l => l.trim());
  if(blocks.length > 1 && lines.length && lines.every(l => /^[①-⑩]/.test(l))){
    const intro = blocks.slice(0,-1).join("\n\n");
    return `${esc(intro)}<div class="q-choices">${esc(lines.join("\n"))}</div>`;
  }
  return esc(text);
}

// q.q 텍스트를 "설명 / ①②③④... / ㄱㄴㄷㄹ..." 세 블록으로 분리
function parseConnectQ(text){
  const blocks = String(text).split(/\n\n+/);
  let introParts = [], left = null, right = null;
  blocks.forEach(block => {
    const lines = block.split("\n").filter(l => l.trim());
    if(!lines.length) return;
    if(lines.every(l => /^[①-⑩]/.test(l))){
      left = lines.map(l => {
        const m = l.match(/^([①-⑩])\s*(.*)$/);
        return m ? { key:m[1], text:m[2] } : { key:l[0], text:l.slice(1).trim() };
      });
    } else if(lines.every(l => /^[ㄱ-ㅎ]\s*[.)]/.test(l))){
      right = lines.map(l => {
        const m = l.match(/^([ㄱ-ㅎ])\s*[.)]\s*(.*)$/);
        return m ? { key:m[1], text:m[2] } : { key:l[0], text:l.slice(1).trim() };
      });
    } else {
      introParts.push(block);
    }
  });
  return { intro: introParts.join("\n\n"), left, right };
}

function renderConnectUI(parsed){
  const leftHtml = parsed.left.map(it => `
    <div class="connect-item" data-side="left" data-key="${esc(it.key)}">
      <span class="connect-label">${esc(it.key)}</span>
      <span class="connect-text">${esc(it.text)}</span>
      <span class="connect-dot" data-side="left" data-key="${esc(it.key)}"></span>
    </div>`).join("");
  const rightHtml = parsed.right.map(it => `
    <div class="connect-item" data-side="right" data-key="${esc(it.key)}">
      <span class="connect-dot" data-side="right" data-key="${esc(it.key)}"></span>
      <span class="connect-label">${esc(it.key)}</span>
      <span class="connect-text">${esc(it.text)}</span>
    </div>`).join("");
  return `
    <div class="connect-box">
      ${parsed.intro ? `<div class="connect-intro">${esc(parsed.intro)}</div>` : ""}
      <div class="connect-wrap" id="connectWrap">
        <svg class="connect-svg" id="connectSvg"></svg>
        <div class="connect-col left">${leftHtml}</div>
        <div class="connect-col right">${rightHtml}</div>
      </div>
      <button type="button" class="connect-reset" id="connectReset">↺ 연결선 지우기</button>
    </div>
  `;
}

function initConnectUI(parsed){
  const wrap = document.getElementById("connectWrap");
  if(!wrap) return;
  const svg = document.getElementById("connectSvg");
  const colorMap = {};
  parsed.left.forEach((it,i) => { colorMap[it.key] = CONNECT_COLORS[i % CONNECT_COLORS.length]; });

  let connections = []; // {leftKey, rightKey, color}
  let pending = null;   // {side,key} — 탭-탭 방식으로 선택된 항목
  let drag = null;      // 진행 중인 드래그 상태

  const dotEl = (side,key) => wrap.querySelector(`.connect-dot[data-side="${side}"][data-key="${key}"]`);

  function dotCenter(el){
    const r = el.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    return { x: r.left + r.width/2 - wr.left, y: r.top + r.height/2 - wr.top };
  }

  function redraw(){
    const wr = wrap.getBoundingClientRect();
    svg.setAttribute("width", wr.width);
    svg.setAttribute("height", wr.height);
    let html = "";
    connections.forEach(c => {
      const a = dotCenter(dotEl("left", c.leftKey)), b = dotCenter(dotEl("right", c.rightKey));
      html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${c.color}" stroke-width="4" stroke-linecap="round"/>`;
    });
    if(drag){
      html += `<line x1="${drag.x0}" y1="${drag.y0}" x2="${drag.x1}" y2="${drag.y1}" stroke="#9b9a97" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>`;
    }
    svg.innerHTML = html;
  }

  function updateLinkedClasses(){
    wrap.querySelectorAll(".connect-item").forEach(el => {
      const side = el.dataset.side, key = el.dataset.key;
      const conn = connections.find(c => (side === "left" ? c.leftKey : c.rightKey) === key);
      el.classList.toggle("linked", !!conn);
      const dot = dotEl(side,key);
      dot.style.background = conn ? conn.color : "";
      dot.style.borderColor = conn ? conn.color : "";
    });
  }

  function clearSelected(){
    wrap.querySelectorAll(".connect-item.selected").forEach(el => el.classList.remove("selected"));
  }

  function connect(a,b){
    const leftKey = a.side === "left" ? a.key : b.key;
    const rightKey = a.side === "left" ? b.key : a.key;
    connections = connections.filter(c => c.leftKey !== leftKey && c.rightKey !== rightKey);
    connections.push({ leftKey, rightKey, color: colorMap[leftKey] || "#888" });
    updateLinkedClasses();
  }

  wrap.querySelectorAll(".connect-item").forEach(el => {
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const side = el.dataset.side, key = el.dataset.key;

      if(pending && pending.side !== side){
        connect(pending, {side,key});
        pending = null; clearSelected(); redraw();
        return;
      }
      pending = null; clearSelected();

      const p0 = dotCenter(dotEl(side,key));
      drag = { side, key, moved:false, x0:p0.x, y0:p0.y, x1:p0.x, y1:p0.y, sx:e.clientX, sy:e.clientY };
      el.classList.add("dragging");
      try{ el.setPointerCapture(e.pointerId); }catch(_){}

      const onMove = (ev) => {
        if(!drag) return;
        if(Math.abs(ev.clientX-drag.sx) > 4 || Math.abs(ev.clientY-drag.sy) > 4) drag.moved = true;
        const wr = wrap.getBoundingClientRect();
        drag.x1 = ev.clientX - wr.left; drag.y1 = ev.clientY - wr.top;
        redraw();
      };
      const onUp = (ev) => {
        cleanup();
        el.classList.remove("dragging");
        const targetItem = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".connect-item");
        if(drag && drag.moved && targetItem && targetItem.dataset.side !== side){
          connect({side,key}, {side:targetItem.dataset.side, key:targetItem.dataset.key});
        } else if(drag && !drag.moved){
          pending = {side,key};
          el.classList.add("selected");
        }
        drag = null;
        redraw();
      };
      const onCancel = () => { cleanup(); el.classList.remove("dragging"); drag = null; redraw(); };
      function cleanup(){
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        el.removeEventListener("pointercancel", onCancel);
        try{ el.releasePointerCapture(e.pointerId); }catch(_){}
      }
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
      el.addEventListener("pointercancel", onCancel);
    });
  });

  document.getElementById("connectReset").addEventListener("click", () => {
    connections = [];
    pending = null;
    clearSelected();
    updateLinkedClasses();
    redraw();
  });

  window.onresize = redraw;
  requestAnimationFrame(redraw);
}

/* ============================================================
   점수 부여 모달
   ============================================================ */
function openAwardModal(q){
  const rec = state.solved[q.id];
  const maxScore = q.tier;
  const scoreOptions = [];
  for(let s = maxScore; s >= 10; s -= 10) scoreOptions.push(s);
  const defaultScore = (rec && scoreOptions.includes(rec.score)) ? rec.score : maxScore;

  const scorePickHtml = scoreOptions.length > 1
    ? `<div class="score-pick" id="scorePick">
        ${scoreOptions.map(s => `<button data-score="${s}" class="${s===defaultScore?"on":""}">${s}점</button>`).join("")}
      </div>`
    : "";

  const teamBtns = state.names.slice(0, state.teamCount).map((n,i) =>
    `<button data-team="${i}" ${rec && rec.team===i ? 'style="outline:2px solid '+TEAM_COLORS[i]+';outline-offset:-1px"' : ""}>
      <span class="dot" style="background:${TEAM_COLORS[i]}"></span>${esc(n)}
    </button>`).join("");

  const undo = rec ? `<button class="btn danger" id="mUndo">정답 처리 취소</button>` : "";

  document.getElementById("overlay").innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">
        <h3>정답을 맞춘 조 선택</h3>
        <p>문항 ${q.id} · 최대 ${maxScore}점${scoreOptions.length > 1 ? " — 점수를 고른 뒤 조를 선택하세요." : " — 조를 선택하면 부여됩니다."}</p>
        ${scorePickHtml}
        <div class="team-pick">${teamBtns}</div>
        <div class="modal-actions">
          ${undo}
          <button class="btn" id="mCancel">닫기</button>
        </div>
      </div>
    </div>`;

  document.getElementById("modalBack").addEventListener("click", (e) => { if(e.target.id === "modalBack") closeModal(); });
  document.getElementById("mCancel").addEventListener("click", closeModal);
  const u = document.getElementById("mUndo");
  if(u) u.addEventListener("click", () => {
    delete state.solved[q.id]; saveState(); closeModal(); render();
    toast(`${q.id} 정답 처리 취소`);
  });
  document.querySelectorAll(".score-pick button").forEach(b =>
    b.addEventListener("click", () => {
      document.querySelectorAll(".score-pick button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
    }));
  document.querySelectorAll(".team-pick button").forEach(b =>
    b.addEventListener("click", () => {
      const t = parseInt(b.dataset.team,10);
      const chosen = parseInt(document.querySelector(".score-pick button.on")?.dataset.score, 10) || maxScore;
      state.solved[q.id] = { team:t, score:chosen }; saveState(); closeModal(); render();
      toast(`${esc(state.names[t])}  +${chosen}점`);
    }));
}
function closeModal(){
  document.getElementById("overlay").innerHTML = "";
  const rb = document.getElementById("revealBtn");
  if(rb) rb.textContent = "🔒 정답 보기";
}

/* ============================================================
   정답 팝업 (중앙)
   ============================================================ */
function openAnswerModal(q){
  document.getElementById("overlay").innerHTML = `
    <div class="modal-back" id="ansBack">
      <div class="modal answer-modal">
        <div class="alabel">정답</div>
        <div class="atext">${esc(q.a)}</div>
        <div class="refs">${q.refs.map(r => `<div>· ${esc(r)}</div>`).join("")}</div>
        ${q.note ? `<div class="note">${esc(q.note)}</div>` : ""}
        <div class="modal-actions"><button class="btn" id="ansClose">닫기</button></div>
      </div>
    </div>`;
  document.getElementById("ansBack").addEventListener("click", (e) => { if(e.target.id === "ansBack") closeModal(); });
  document.getElementById("ansClose").addEventListener("click", closeModal);
  const rb = document.getElementById("revealBtn");
  if(rb) rb.textContent = "🔓 정답 숨기기";
}

/* ============================================================
   점수판 (크게)
   ============================================================ */
function viewScoreboard(){
  const scores = teamScores();
  const rows = state.names.slice(0, state.teamCount).map((n,i) => ({ n, i, sc: scores[i] }));
  rows.sort((a,b) => b.sc - a.sc);
  const max = Math.max(10, ...scores);
  const solvedCount = Object.keys(state.solved).filter(id => state.solved[id].team < state.teamCount).length;

  let rank = 0, prevScore = null;
  const list = rows.map((r, idx) => {
    if(r.sc !== prevScore){ rank = idx + 1; prevScore = r.sc; }
    const rc = rank <= 3 ? "r"+rank : "";
    const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : "";
    return `<div class="sb-row">
      <div class="sb-rank ${rc}">${medal || rank}</div>
      <div class="sb-main">
        <div class="sb-name"><span style="width:12px;height:12px;border-radius:50%;background:${TEAM_COLORS[r.i]};display:inline-block"></span>${esc(r.n)}</div>
        <div class="sb-bar-track"><div class="sb-bar" style="width:${(r.sc/max*100)}%;background:${TEAM_COLORS[r.i]}"></div></div>
      </div>
      <div class="sb-score">${r.sc}</div>
    </div>`;
  }).join("");

  return `
    <div class="q-top"><a class="q-back" href="#/">← 그리드로</a><span></span></div>
    <h1 class="page-title">점수판</h1>
    <p class="page-sub">푼 문항 ${solvedCount} / ${QUESTIONS.length} · 합계 ${scores.reduce((a,b)=>a+b,0)}점</p>
    <div class="sb-list">${list}</div>
  `;
}

/* ============================================================
   설정 · 조 편성
   ============================================================ */
function viewSettings(){
  const countBtns = [2,3,4,5,6].map(c =>
    `<button data-count="${c}" class="${state.teamCount===c?"on":""}">${c}조</button>`).join("");
  const inputs = state.names.map((n,i) =>
    `<div class="team-input-row ${i>=state.teamCount?"off":""}">
      <span class="dot" style="background:${TEAM_COLORS[i]}"></span>
      <input type="text" data-idx="${i}" value="${esc(n)}" ${i>=state.teamCount?"disabled":""} maxlength="20" />
    </div>`).join("");

  return `
    <h1 class="page-title">설정 · 조 편성</h1>
    <p class="page-sub">여기서 정한 조와 점수는 이 브라우저에 저장되어 새로고침해도 유지됩니다.</p>

    <div class="set-block">
      <h3>조 수</h3>
      <p class="hint">참가하는 조의 수를 고르세요. (최대 6조)</p>
      <div class="count-btns" id="countBtns">${countBtns}</div>

      <h3>조 이름</h3>
      <p class="hint">기본값은 "1조 ~ 6조"입니다. 필요하면 팀명으로 바꾸세요.</p>
      ${inputs}
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="saveTeams">저장</button>
        <span id="saveMsg" style="align-self:center;font-size:13px;color:var(--t20);font-weight:600"></span>
      </div>
    </div>

    <div class="set-block">
      <h3>진행 초기화</h3>
      <p class="hint">모든 문항의 정답 처리 기록과 점수를 지웁니다. 조 이름은 유지됩니다.</p>
      <button class="btn danger" id="resetProgress">점수 · 진행 상황 초기화</button>
    </div>
  `;
}
function initSettings(){
  document.querySelectorAll("#countBtns button").forEach(b =>
    b.addEventListener("click", () => {
      state.teamCount = parseInt(b.dataset.count,10);
      // 빈 이름 자동 채움
      state.names = state.names.map((n,i) => n && n.trim() ? n : `${i+1}조`);
      saveState(); render();
    }));
  document.getElementById("saveTeams").addEventListener("click", () => {
    document.querySelectorAll(".team-input-row input").forEach(inp => {
      const i = parseInt(inp.dataset.idx,10);
      const v = inp.value.trim();
      state.names[i] = v || `${i+1}조`;
    });
    saveState();
    const m = document.getElementById("saveMsg");
    m.textContent = "저장되었습니다 ✓";
    setTimeout(() => { m.textContent = ""; }, 2000);
    renderSidebar(parseHash());
  });
  document.getElementById("resetProgress").addEventListener("click", () => {
    if(confirm("모든 조의 점수와 정답 처리 기록을 지웁니다. 계속할까요?")){
      state.solved = {}; saveState(); render();
      toast("진행 상황을 초기화했습니다");
    }
  });
}

/* ============================================================
   유틸
   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ""; }, 2200);
}
</script>
